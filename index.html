<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control LED Arduino</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="contenedor">

        <h1>CONTROL LED ARDUINO</h1>

        <p>Controla un LED desde tu navegador</p>

        <section class="conexion">

            <p id="estadoConexion">
                Arduino desconectado
            </p>

            <button id="btnConectar">
                Conectar Arduino
            </button>

        </section>

        <section class="panel">

            <div id="bombilla" class="bombilla apagado">
            </div>

            <h2 id="estadoLed">LED APAGADO</h2>

            <div class="botones">

                <button id="btnEncender" disabled>
                    ENCENDER
                </button>

                <button id="btnApagar" disabled>
                    APAGAR
                </button>

            </div>

            <p id="mensaje">
                Conecta Arduino para comenzar
            </p>

        </section>

    </main>

    <script src="script.js"></script>


</body>

</html>
